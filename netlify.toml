[build]
  publish = "."

# Toujours revalider les fichiers de l'appli : une mise à jour est visible tout de suite
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/presentation/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/presentation"
  to = "/presentation/"
  status = 301
